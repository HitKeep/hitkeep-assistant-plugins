name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 scripts/package.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/package.py --output /tmp/hitkeep-analytics.zip
      - run: unzip -t /tmp/hitkeep-analytics.zip
